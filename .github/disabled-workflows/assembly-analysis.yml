name: Assembly instruction analysis
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  assembly:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore TenkaChan.slnx
      - run: dotnet build TenkaChan.slnx -c Release --no-restore
      - id: fixture
        run: dotnet build tests/Fixtures/TrustedLocalJitApp/TrustedLocalJitApp.csproj -c Release
      - run: node --check src/TenkaChan.Web/wwwroot/assembly.js
      - name: Verify decoder, callable coverage and actual .NET 8 machine code
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:TENKA_ASSEMBLY_SMOKE_DLL = "$env:GITHUB_WORKSPACE/tests/Fixtures/TrustedLocalJitApp/bin/Release/net8.0/TrustedLocalJitApp.dll"
          $env:TENKA_ASSEMBLY_TEST_REPORT = "$env:GITHUB_WORKSPACE/assembly-decoder-report.json"
          dotnet test tests/TenkaChan.Tests/TenkaChan.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~NativeInstruction|FullyQualifiedName~CallableCoverageTests' --logger 'trx;LogFileName=assembly.trx'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read-only assembly HTTP and MCP integration
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        run: python tests/Fixtures/assembly_workflow_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assembly-analysis-${{ matrix.os }}
          path: |
            assembly-*.json
            artifacts/assembly-*.json
            tests/TenkaChan.Tests/TestResults/assembly.trx
