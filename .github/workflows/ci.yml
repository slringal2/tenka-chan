name: Build and unit test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - run: dotnet restore TenkaChan.slnx
      - run: dotnet build TenkaChan.slnx --configuration Release --no-restore
      - run: dotnet test TenkaChan.slnx --configuration Release --no-build
      - name: Build trusted local host JIT fixture
        run: dotnet build tests/Fixtures/TrustedLocalJitApp/TrustedLocalJitApp.csproj --configuration Release
      - name: Build paired trusted .NET 8 whole-process fixtures
        run: |
          dotnet build tests/Fixtures/TrustedLocalPerf/Before/Before.csproj --configuration Release
          dotnet build tests/Fixtures/TrustedLocalPerf/After/After.csproj --configuration Release
      - name: Verify host-only wall/CPU workload measurements and A/B comparison
        env:
          TENKA_LOCAL_PERF_BEFORE: ${{ github.workspace }}/tests/Fixtures/TrustedLocalPerf/Before/bin/Release/net8.0/Before.dll
          TENKA_LOCAL_PERF_AFTER: ${{ github.workspace }}/tests/Fixtures/TrustedLocalPerf/After/bin/Release/net8.0/After.dll
          TENKA_LOCAL_JIT_SMOKE_ASSEMBLY: ${{ github.workspace }}/tests/Fixtures/TrustedLocalJitApp/bin/Release/net8.0/TrustedLocalJitApp.dll
        run: dotnet test tests/TenkaChan.Tests/TenkaChan.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~TrustedLocalProcessProfilerTests
      - name: Verify actual host-native JIT capture without Docker
        env:
          TENKA_LOCAL_JIT_SMOKE_ASSEMBLY: ${{ github.workspace }}/tests/Fixtures/TrustedLocalJitApp/bin/Release/net8.0/TrustedLocalJitApp.dll
        run: dotnet test tests/TenkaChan.Tests/TenkaChan.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~TrustedLocalJitRunnerTests
      - name: Validate browser JavaScript syntax
        run: node --check src/TenkaChan.Web/wwwroot/app.js
      - name: Smoke test localhost Web UI and Roslyn API
        env:
          TENKA_TRUST_MSBUILD: '1'
          TENKA_WEB_PORT: '5077'
          TENKA_ENABLE_LOCAL_EXEC: '1'
          TENKA_LLM_MODEL: 'ci-fixture'
          TENKA_LLM_ENDPOINT: 'http://127.0.0.1:18081/v1/chat/completions'
        run: |
          set -euo pipefail
          export TENKA_ALLOWED_ROOTS="$GITHUB_WORKSPACE/tests/Fixtures/UiSample:$GITHUB_WORKSPACE/tests/Fixtures/TrustedLocalJitApp:$GITHUB_WORKSPACE/tests/Fixtures/TrustedLocalPerf"
          dotnet run --project src/TenkaChan.Web/TenkaChan.Web.csproj --configuration Release --no-build --no-launch-profile >/tmp/tenka-web.log 2>&1 &
          web_pid=$!
          python3 tests/Fixtures/fake_llm_server.py >/tmp/tenka-fake-llm.log 2>&1 &
          llm_pid=$!
          trap 'kill "$web_pid" "$llm_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            if curl --silent --fail http://127.0.0.1:18081/health >/dev/null; then break; fi
            sleep 0.2
          done
          curl --silent --show-error --fail http://127.0.0.1:18081/health >/dev/null
          for attempt in $(seq 1 50); do
            if curl --silent --fail http://127.0.0.1:5077/api/session >/tmp/tenka-web-session.json; then break; fi
            sleep 1
          done
          if [ ! -s /tmp/tenka-web-session.json ]; then cat /tmp/tenka-web.log; exit 1; fi
          curl --silent --show-error --fail http://127.0.0.1:5077/ >/tmp/tenka-web-index.html
          grep -q 'DEEP REVIEW CONSOLE' /tmp/tenka-web-index.html
          token=$(python3 -c 'import json; print(json.load(open("/tmp/tenka-web-session.json"))["csrfToken"])')
          status=$(curl --silent -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:5077/api/workspace/scan -H 'Content-Type: application/json' -d '{}')
          test "$status" = '403'
          export PROJECT="$GITHUB_WORKSPACE/tests/Fixtures/UiSample/UiSample.csproj"
          payload=$(python3 -c 'import json,os; print(json.dumps({"path":os.environ["PROJECT"]}))')
          curl --silent --show-error --fail -X POST http://127.0.0.1:5077/api/workspace/open \
            -H 'Content-Type: application/json' -H "X-Tenka-CSRF: $token" \
            --data-binary "$payload" >/tmp/tenka-web-open.json
          python3 -c 'import json; x=json.load(open("/tmp/tenka-web-open.json")); assert x["methodCount"] >= 2, x'
          curl --silent --show-error --fail -X POST http://127.0.0.1:5077/api/workspace/scan \
            -H 'Content-Type: application/json' -H "X-Tenka-CSRF: $token" \
            -d '{}' >/tmp/tenka-web-scan.json
          python3 -c 'import json; x=json.load(open("/tmp/tenka-web-scan.json")); assert x["findingCount"] >= 1, x'
          curl --silent --show-error --fail 'http://127.0.0.1:5077/api/methods?limit=10' >/tmp/tenka-web-methods.json
          python3 -c 'import json; x=json.load(open("/tmp/tenka-web-methods.json")); assert len(x) >= 2, x'
          curl --silent --show-error --fail 'http://127.0.0.1:5077/api/findings?limit=10' >/tmp/tenka-web-findings.json
          python3 -c 'import json; x=json.load(open("/tmp/tenka-web-findings.json")); assert x["total"] >= 1, x'
          curl --silent --show-error --fail http://127.0.0.1:5077/api/deterministic/rules >/tmp/tenka-web-rules.json
          python3 -c 'import json; x=json.load(open("/tmp/tenka-web-rules.json")); assert any(r["ruleId"] == "CORRECT2001" for r in x["rules"])'
          curl --silent --show-error --fail -X POST http://127.0.0.1:5077/api/deterministic/run \
            -H 'Content-Type: application/json' -H "X-Tenka-CSRF: $token" \
            -d '{"maxFindings":100,"maxMethodMetrics":10}' >/tmp/tenka-web-deterministic.json
          python3 -c 'import json; x=json.load(open("/tmp/tenka-web-deterministic.json")); assert x["summary"]["methodsIndexed"] >= 2, x["summary"]; assert any(f["ruleId"] == "PERF1001" for f in x["findings"]), x["findings"]; assert x["methodMetrics"], x'
          curl --silent --show-error --fail http://127.0.0.1:5077/api/deterministic/report >/tmp/tenka-web-deterministic-cached.json
          python3 -c 'import json; a=json.load(open("/tmp/tenka-web-deterministic.json")); b=json.load(open("/tmp/tenka-web-deterministic-cached.json")); assert a == b'
          curl --silent --show-error --fail -X POST http://127.0.0.1:5077/api/hotspots/scan \
            -H 'Content-Type: application/json' -H "X-Tenka-CSRF: $token" \
            -d '{"maxMethods":10,"maxSites":30}' >/tmp/tenka-web-hotspots.json
          python3 -c 'import json; x=json.load(open("/tmp/tenka-web-hotspots.json")); assert x["evidenceLevel"] == "static_candidate", x; assert x["totalMethods"] >= 2; assert any(s["category"] == "linq_materialization" for s in x["sites"]), x'
          export HOTSPOT_PROFILE="$GITHUB_WORKSPACE/tests/Fixtures/UiSample/ci.speedscope.json"
          profile_payload=$(python3 -c 'import json,os; print(json.dumps({"filePath":os.environ["HOTSPOT_PROFILE"],"profileIndex":0,"maxFrames":20}))')
          curl --silent --show-error --fail -X POST http://127.0.0.1:5077/api/hotspots/profile/import \
            -H 'Content-Type: application/json' -H "X-Tenka-CSRF: $token" \
            --data-binary "$profile_payload" >/tmp/tenka-web-profile.json
          python3 -c 'import json; x=json.load(open("/tmp/tenka-web-profile.json")); assert x["totalSamples"] == 3, x; assert x["linkedFrames"] >= 1, x; assert any(f["matchedMethodId"] for f in x["frames"]), x'
          curl --silent --show-error --fail http://127.0.0.1:5077/api/hotspots/report >/tmp/tenka-web-hotspot-cached.json
          python3 -c 'import json; x=json.load(open("/tmp/tenka-web-hotspot-cached.json")); assert x["staticAnalysis"]["totalSites"] >= 1, x; assert x["sampledProfile"]["totalSamples"] == 3, x'


          export PERF_BEFORE="$GITHUB_WORKSPACE/tests/Fixtures/TrustedLocalPerf/Before/bin/Release/net8.0/Before.dll"
          export PERF_AFTER="$GITHUB_WORKSPACE/tests/Fixtures/TrustedLocalPerf/After/bin/Release/net8.0/After.dll"
          perf_payload=$(python3 -c 'import json,os; print(json.dumps({"baselineAssembly":os.environ["PERF_BEFORE"],"candidateAssembly":os.environ["PERF_AFTER"],"trustedBinary":True,"repetitions":5,"warmups":1,"timeoutSeconds":15}))')
          curl --silent --show-error --fail -X POST http://127.0.0.1:5077/api/local-performance/measure \
            -H 'Content-Type: application/json' -H "X-Tenka-CSRF: $token" \
            --data-binary "$perf_payload" >/tmp/tenka-local-perf.json
          python3 -c 'import json; x=json.load(open("/tmp/tenka-local-perf.json")); assert x["status"] == "completed", x; assert len(x["samples"]) == 12, x; assert x["comparison"] is not None, x'
          perf_id=$(python3 -c 'import json; print(json.load(open("/tmp/tenka-local-perf.json"))["id"])')
          curl --silent --show-error --fail "http://127.0.0.1:5077/api/local-performance/$perf_id" >/tmp/tenka-local-perf-saved.json
          python3 -c 'import json; x=json.load(open("/tmp/tenka-local-perf-saved.json")); assert x["status"] == "completed", x'
          perf_untrusted=$(python3 -c 'import json,os; print(json.dumps({"baselineAssembly":os.environ["PERF_BEFORE"],"trustedBinary":False}))')
          perf_denied=$(curl --silent -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:5077/api/local-performance/measure \
            -H 'Content-Type: application/json' -H "X-Tenka-CSRF: $token" \
            --data-binary "$perf_untrusted")
          test "$perf_denied" = '400'
          export LOCAL_JIT_BINARY="$GITHUB_WORKSPACE/tests/Fixtures/TrustedLocalJitApp/bin/Release/net8.0/TrustedLocalJitApp.dll"
          local_payload=$(python3 -c 'import json,os; print(json.dumps({"assemblyPath":os.environ["LOCAL_JIT_BINARY"],"jitFilter":"LocalJitFixture:Compute","trustedBinary":True,"timeoutSeconds":45}))')
          curl --silent --show-error --fail -X POST http://127.0.0.1:5077/api/local-jit/capture \
            -H 'Content-Type: application/json' -H "X-Tenka-CSRF: $token" \
            --data-binary "$local_payload" >/tmp/tenka-local-jit-http.json
          python3 -c 'import json; x=json.load(open("/tmp/tenka-local-jit-http.json")); assert x["status"] == "jit_completed", x; assert x["nativeDisassembly"]["instructionCount"] > 0, x'
          local_id=$(python3 -c 'import json; print(json.load(open("/tmp/tenka-local-jit-http.json"))["id"])')
          curl --silent --show-error --fail "http://127.0.0.1:5077/api/local-jit/$local_id" >/tmp/tenka-local-jit-saved.json
          python3 -c 'import json; x=json.load(open("/tmp/tenka-local-jit-saved.json")); assert x["status"] == "jit_completed", x'
          denied_payload=$(python3 -c 'import json,os; print(json.dumps({"assemblyPath":os.environ["LOCAL_JIT_BINARY"],"jitFilter":"LocalJitFixture:Compute","trustedBinary":False}))')
          denied_status=$(curl --silent -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:5077/api/local-jit/capture \
            -H 'Content-Type: application/json' -H "X-Tenka-CSRF: $token" \
            --data-binary "$denied_payload")
          test "$denied_status" = '400'
          curl --silent --show-error --fail -X POST http://127.0.0.1:5077/api/reviews/start \
            -H 'Content-Type: application/json' -H "X-Tenka-CSRF: $token" \
            -d '{"maxMethods":2,"maxMinutes":1}' >/tmp/tenka-web-review-start.json
          review_id=$(python3 -c 'import json; print(json.load(open("/tmp/tenka-web-review-start.json"))["runId"])')
          for attempt in $(seq 1 80); do
            curl --silent --show-error --fail "http://127.0.0.1:5077/api/reviews/$review_id" >/tmp/tenka-web-review-status.json
            if python3 -c 'import json,sys; s=json.load(open("/tmp/tenka-web-review-status.json")); sys.exit(0 if s["status"] in ("completed","completed_with_errors","failed","cancelled","timed_out") else 1)'; then break; fi
            sleep 0.25
          done
          python3 -c 'import json; x=json.load(open("/tmp/tenka-web-review-status.json")); assert x["status"] == "completed", x; assert x["completedMethods"] == 2, x; assert x["hypothesisCount"] >= 1, x'
          curl --silent --show-error --fail http://127.0.0.1:5077/api/hypotheses >/tmp/tenka-web-review-hypotheses.json
          python3 -c 'import json; x=json.load(open("/tmp/tenka-web-review-hypotheses.json")); assert x and all(h["status"] == "suspected" for h in x), x'


  windows-local-jit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - run: dotnet restore TenkaChan.slnx
      - run: dotnet build TenkaChan.slnx --configuration Release --no-restore
      - run: dotnet build tests/Fixtures/TrustedLocalJitApp/TrustedLocalJitApp.csproj --configuration Release
      - name: Build paired trusted .NET 8 whole-process fixtures
        run: |
          dotnet build tests/Fixtures/TrustedLocalPerf/Before/Before.csproj --configuration Release
          dotnet build tests/Fixtures/TrustedLocalPerf/After/After.csproj --configuration Release
      - name: Verify host-only wall/CPU workload measurements and A/B comparison
        env:
          TENKA_LOCAL_PERF_BEFORE: ${{ github.workspace }}/tests/Fixtures/TrustedLocalPerf/Before/bin/Release/net8.0/Before.dll
          TENKA_LOCAL_PERF_AFTER: ${{ github.workspace }}/tests/Fixtures/TrustedLocalPerf/After/bin/Release/net8.0/After.dll
          TENKA_LOCAL_JIT_SMOKE_ASSEMBLY: ${{ github.workspace }}/tests/Fixtures/TrustedLocalJitApp/bin/Release/net8.0/TrustedLocalJitApp.dll
        run: dotnet test tests/TenkaChan.Tests/TenkaChan.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~TrustedLocalProcessProfilerTests
      - name: Verify local .NET 8 RyuJIT machine code on Windows without Docker
        run: dotnet test tests/TenkaChan.Tests/TenkaChan.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~TrustedLocalJitRunnerTests
        env:
          TENKA_LOCAL_JIT_SMOKE_ASSEMBLY: ${{ github.workspace }}/tests/Fixtures/TrustedLocalJitApp/bin/Release/net8.0/TrustedLocalJitApp.dll

  docker-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore TenkaChan.slnx
      - run: dotnet build TenkaChan.slnx --configuration Release --no-restore
      - run: docker pull mcr.microsoft.com/dotnet/sdk:10.0
      - run: docker pull mcr.microsoft.com/dotnet/sdk:8.0
      - name: Diagnose .NET 8 NuGet startup with disposable Docker isolation
        run: |
          set -u
          echo "Checking SDK8 NuGet initialization only; no application code will run."
          for scenario in base restricted shared_memory read_only; do
            args=(--rm --pull=never --network none --user 1654:1654
              --tmpfs /tmp:rw,exec,size=128m,mode=1777
              --tmpfs /work:rw,exec,size=128m,mode=1777
              --env HOME=/work --env DOTNET_CLI_HOME=/work)
            if [ "$scenario" != "base" ]; then
              args+=(--cap-drop ALL --security-opt no-new-privileges
                --pids-limit 128 --memory 2g --cpus 2)
            fi
            if [ "$scenario" = "shared_memory" ]; then
              args+=(--tmpfs /dev/shm:rw,nosuid,nodev,size=64m,mode=1777)
            fi
            if [ "$scenario" = "read_only" ]; then
              args+=(--read-only)
            fi
            if docker run "${args[@]}" mcr.microsoft.com/dotnet/sdk:8.0 \
                dotnet nuget locals global-packages --list >/tmp/tenka-sdk8-check.log 2>&1; then
              echo "SDK8_${scenario}: PASS"
            else
              echo "SDK8_${scenario}: FAIL"
              grep -m 1 -E 'NuGet-Migrations|Unauthorized|IOException' \
                /tmp/tenka-sdk8-check.log || true
            fi
          done
      - name: Test generated xUnit code in network-disabled Docker
        run: dotnet test tests/TenkaChan.Tests/TenkaChan.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~DockerExperimentSmokeTests
        env:
          TENKA_DOCKER_SMOKE: '1'
          TENKA_NUGET_PACKAGES: /home/runner/.nuget/packages
      - name: Prewarm BenchmarkDotNet packages on trusted CI host
        run: dotnet restore tests/Fixtures/BenchmarkCache/BenchmarkCache.csproj
      - name: Test BenchmarkDotNet FullJSON from network-disabled Docker
        run: dotnet test tests/TenkaChan.Tests/TenkaChan.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~DockerBenchmarkSmokeTests
        env:
          TENKA_BENCHMARK_SMOKE: '1'
          TENKA_NUGET_PACKAGES: /home/runner/.nuget/packages
      - name: Prewarm net8.0 xUnit dependencies for offline container
        run: dotnet restore tests/Fixtures/Net8XunitCache/Net8XunitCache.csproj
      - name: Test .NET 8 xUnit execution and native RyuJIT machine code capture
        run: dotnet test tests/TenkaChan.Tests/TenkaChan.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~DockerNet8AndJitSmokeTests
        env:
          TENKA_NET8_DOCKER_SMOKE: '1'
          TENKA_NUGET_PACKAGES: /home/runner/.nuget/packages
