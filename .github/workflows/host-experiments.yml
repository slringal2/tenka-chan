name: Docker-free host experiments
on:
  push:
    branches: [main, "feature/one-click-host-analysis"]
  pull_request:
    paths: ["src/TenkaChan.Mcp/**", "src/TenkaChan.Web/**", "tests/TenkaChan.Tests/QuickHostWorkflowTests.cs", ".github/workflows/host-experiments.yml"]
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore TenkaChan.slnx
      - run: dotnet build TenkaChan.slnx -c Release --no-restore
      - run: dotnet build tests/Fixtures/PrioritySample/PrioritySample.csproj -c Release
      - name: Prewarm official xUnit and BDN package cache
        run: |
          dotnet restore tests/Fixtures/Net8XunitCache/Net8XunitCache.csproj
          dotnet restore tests/Fixtures/BenchmarkCache/BenchmarkCache.csproj
      - run: node --check src/TenkaChan.Web/wwwroot/app.js
      - name: Actual host xUnit and BenchmarkDotNet with explicit test authorization
        shell: pwsh
        env:
          TENKA_ENABLE_LOCAL_EXEC: "1"
          TENKA_ENABLE_UNSANDBOXED_EXPERIMENTS: "1"
          TENKA_TEST_HOST_EXPERIMENTS: "1"
        run: |
          $env:TENKA_HOST_FIXTURE_PROJECT = "$env:GITHUB_WORKSPACE/tests/Fixtures/PrioritySample/PrioritySample.csproj"
          dotnet test tests/TenkaChan.Tests/TenkaChan.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~QuickHostWorkflowTests" --logger "trx;LogFileName=host-workflow.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-workflow-${{ matrix.os }}
          path: tests/TenkaChan.Tests/TestResults/host-workflow.trx
          if-no-files-found: ignore
